name: 手动打包完整包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 打包无名AI完整安装包
    runs-on: ubuntu-latest
    steps:
      - name: 检出最新代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: 生成并校验完整安装包
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd()
          info = json.loads((root / "info.json").read_text(encoding="utf-8"))
          version = info.get("version")
          if not isinstance(version, str) or not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._+-]*", version):
              raise SystemExit("info.json.version 无效")

          version_source = (root / "js/config/version.js").read_text(encoding="utf-8")
          match = re.search(r"\bexport\s+const\s+VERSION\s*=\s*(['\"])([^'\"]+)\1", version_source)
          if not match or match.group(2) != version:
              raise SystemExit("info.json 与 js/config/version.js 版本不一致，停止打包")

          # 使用明确的安装文件白名单：不混入旧 ZIP、测试工具和 GitHub 配置。
          files = [Path(name) for name in ("extension.js", "info.json", "LICENSE", "README.md", "CHANGELOG.md")]
          for name in ("assets", "css", "js", "logs", "model", "score", "shadow"):
              directory = root / name
              if not directory.is_dir() or directory.is_symlink():
                  raise SystemExit(f"必需目录缺失或为符号链接：{name}")
              files.extend(p.relative_to(root) for p in directory.rglob("*") if p.is_file() or p.is_symlink())

          files = sorted(set(files), key=lambda p: p.as_posix())
          for path in files:
              item = root / path
              if not item.is_file() or item.is_symlink():
                  raise SystemExit(f"安装文件缺失或为符号链接：{path}")

          output_dir = root / "dist"
          output_dir.mkdir(exist_ok=True)
          filename = f"wuming_ai_v{version}.zip"
          output = output_dir / filename
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as package:
              for path in files:
                  package.write(root / path, arcname=path.as_posix())

          with ZipFile(output) as package:
              expected = sorted(path.as_posix() for path in files)
              if sorted(package.namelist()) != expected or package.testzip() is not None:
                  raise SystemExit("ZIP 内容校验失败")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"version={version}\nfilename={filename}\n")
          print(f"完整包打包成功：{filename}，包含 {len(files)} 个文件，根目录直接是 extension.js / info.json")
          PY

      - name: 上传完整安装包
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: 无名AI-v${{ steps.package.outputs.version }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: 显示下载链接
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          {
            echo "## 无名AI 完整包打包完成"
            echo
            echo "文件：${PACKAGE_FILENAME}"
            echo
            echo "[点击下载完整 ZIP 安装包](${ARTIFACT_URL})"
            echo
            echo "将压缩包内容解压到无名杀的 extension/无名AI/ 目录中。"
          } >> "$GITHUB_STEP_SUMMARY"
