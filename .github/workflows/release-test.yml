name: Test Release Package

on:
  pull_request:
    paths:
      - ".github/workflows/release-test.yml"
      - "build/verify_release_package.mjs"
      - "js/config/version.js"
      - "info.json"
      - "package.json"
      - "logs/**"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-test.yml"
      - "build/verify_release_package.mjs"
      - "js/config/version.js"
      - "info.json"
      - "package.json"

permissions:
  contents: read

jobs:
  package:
    name: Build test package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      asset: ${{ steps.version.outputs.asset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node --input-type=module -e "import { VERSION_SEMVER } from './js/config/version.js'; process.stdout.write(VERSION_SEMVER)")"
          DISPLAY_VERSION="$(node --input-type=module -e "import { VERSION } from './js/config/version.js'; process.stdout.write(VERSION)")"

          if [[ -z "$VERSION" || -z "$DISPLAY_VERSION" ]]; then
            echo "Version source returned an empty value."
            exit 1
          fi

          if [[ "$VERSION" != *-test ]]; then
            echo "Test release workflow only accepts *-test versions. Got: $VERSION"
            exit 1
          fi

          if [[ "$DISPLAY_VERSION" != "$VERSION" ]]; then
            echo "VERSION and VERSION_SEMVER must match for test releases."
            echo "VERSION=$DISPLAY_VERSION"
            echo "VERSION_SEMVER=$VERSION"
            exit 1
          fi

          INFO_VERSION="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('info.json','utf8')); process.stdout.write(String(x.version||''))")"
          PACKAGE_VERSION="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(String(x.version||''))")"

          if [[ "$INFO_VERSION" != "$VERSION" || "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch:"
            echo "version.js=$VERSION"
            echo "info.json=$INFO_VERSION"
            echo "package.json=$PACKAGE_VERSION"
            exit 1
          fi

          ASSET="UnknownAI_${VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Packaging test version: $VERSION"

      - name: Run release gate
        run: npm test

      - name: Build and audit extension package
        shell: bash
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p "dist/无名AI"

          for item in extension.js info.json js score css assets data logs README.md CHANGELOG.md LICENSE; do
            if [[ ! -e "$item" ]]; then
              echo "Required release item is missing: $item"
              exit 1
            fi
            cp -R "$item" "dist/无名AI/"
          done

          node build/verify_release_package.mjs "dist/无名AI"

          # 无名杀 game.importExtension() 只在 ZIP 根目录识别 info.json / extension.js。
          # 因此发布 ZIP 必须直接打包扩展内容，不能再套一层“无名AI/”目录。
          (
            cd "dist/无名AI"
            zip -q -r "../../$ASSET" .
          )

          test -s "$ASSET"

          unzip -Z1 "$ASSET" > package-files.txt
          grep -q '^extension.js

          echo "Package ready: $ASSET"
          du -h "$ASSET"
          echo "Files: $(wc -l < package-files.txt)"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnknownAI-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: UnknownAI-${{ needs.package.outputs.version }}

      - name: Create or reuse test pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          ASSET: ${{ needs.package.outputs.asset }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          cat > release-notes.md <<EOF
          ## 无名AI $VERSION 测试版

          这是底层决策架构调整后的实战测试版本，当前阶段以发现和修复 P0 / P1 问题为主。

          ### 安装

          1. 下载 **$ASSET**
          2. 在无名杀中打开 **扩展 → 导入扩展**
          3. 直接选择下载的 ZIP，无需解压、无需手动复制目录
          4. 导入完成后完全重启无名杀
          5. 在扩展设置中应看到“玩家选项 / 开发者选项”设置中心
          6. 控制台执行 DJSC.VERSION，应显示 $VERSION

          ### 本版修复

          - 新增 Unified Utility Pipeline：统一收益向量、双轨评分观测与残差对账
          - canonical 决策仍使用旧 candidate.score；Utility Vector 仅做 shadow，不改变 winner
          - 候选生成阶段已有复杂专项分明确记录为 legacyBase，不伪装成已完成迁移
          - 第一批迁移 modeStrategy/team、身份暴露/uncertainty、方向守卫/team、共享知识/team、技能进度/future、资源最大化/resource、损失最小化/risk、Character Policy/synergy
          - Basic rules 改分暂记 legacyResidual
          - Strategic Intent / priority / veto / Planner policy band / Guard 继续独立于 Utility
          - 详细 Decision Trace 显示 legacyBase、收益维度、shadowUtility 与 residual
          - Top-N quality snapshot 增加 utility
          - 新增 utility 质量维度与 utility_pipeline 固定场景
          - 不重写桃、无懈、铁索、AOE、判定、装备等专项策略

          ### 测试重点

          - 身份判断与敌我关系
          - 桃 / 无懈 / 铁索
          - 乐、兵、顺、拆的连续动作一致性
          - AOE 与残局策略
          - 多目标 / 多阶段技能决策
          - 卡死、报错、无限循环等 P0 问题

          自动化 release gate 与 release package dependency audit 已在发布前执行通过。
          EOF

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
