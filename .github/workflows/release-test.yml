          cat > release-notes.md <<EOF
          ## 无名AI $VERSION 测试版

          这是底层决策架构调整后的实战测试版本，当前阶段以发现和修复 P0 / P1 问题为主。

          ### 安装

          1. 下载 **$ASSET**
          2. 解压后得到 **无名AI** 文件夹
          3. 将该文件夹放入无名杀的 extension/ 目录，覆盖旧版本前建议先备份
          4. 完全重启无名杀
          5. 控制台执行 DJSC.VERSION，应显示 $VERSION

          ### 本版修复

          - 新增 Unified Utility Pipeline：统一收益向量、双轨评分观测与残差对账
          - canonical 决策仍使用旧 candidate.score；Utility Vector 仅做 shadow，不改变 winner
          - 候选生成阶段已有复杂专项分明确记录为 legacyBase，不伪装成已完成迁移
          - 第一批迁移 modeStrategy/team、身份暴露/uncertainty、方向守卫/team、共享知识/team、技能进度/future、资源最大化/resource、损失最小化/risk、Character Policy/synergy
          - Basic rules 改分暂记 legacyResidual
          - Strategic Intent / priority / veto / Planner policy band / Guard 继续独立于 Utility
          - 详细 Decision Trace 显示 legacyBase、收益维度、shadowUtility 与 residual
          - Top-N quality snapshot 增加 utility
          - 新增 utility 质量维度与 utility_pipeline 固定场景
          - 不重写桃、无懈、铁索、AOE、判定、装备等专项策略

          ### 测试重点

          - 身份判断与敌我关系
          - 桃 / 无懈 / 铁索
          - 乐、兵、顺、拆的连续动作一致性
          - AOE 与残局策略
          - 多目标 / 多阶段技能决策
          - 卡死、报错、无限循环等 P0 问题

          自动化 release gate 与 release package dependency audit 已在发布前执行通过。
          EOF

          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "无名AI $VERSION 测试版" \
            --notes-file release-notes.md \
            --prerelease
