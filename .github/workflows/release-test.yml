            --prerelease
 package-files.txt
          grep -q '^info.json

          echo "Package ready: $ASSET"
          du -h "$ASSET"
          echo "Files: $(wc -l < package-files.txt)"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnknownAI-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

